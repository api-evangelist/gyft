name: Gyft
description: >-
  Gyft is a digital gift card platform and marketplace (a Fiserv / First Data
  company) for buying, sending, storing, and redeeming digital gift cards from
  more than 250 retail brands. Consumers use the Gyft web app and mobile apps to
  consolidate and manage gift cards, while businesses use the Gyft API and Gyft
  SDK to add digital gift cards to their own apps, websites, employee rewards,
  and incentive programs, and to place bulk corporate orders through Gyft
  Business. Developer and API access is provisioned to enrolled partners via the
  Gyft developer portal. Surfaced originally as a portfolio company of 500 Global
  and GV, and enriched here from Gyft's public developer surface.
